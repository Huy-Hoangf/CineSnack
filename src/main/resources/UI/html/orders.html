<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đơn của tôi | CineSnack</title>
    <link rel="stylesheet" href="../assets/css/site.css" />
    <link rel="stylesheet" href="../assets/css/app.css" />
    <link rel="stylesheet" href="../assets/css/orders.css" />
    <script src="../assets/js/api.js" defer></script>
    <script src="../assets/js/cinema.js" defer></script>
    <script src="../assets/js/orders.js" defer></script>
    <script src="../assets/js/authentication.js" defer></script>
    <link rel="stylesheet" href="../assets/css/authentication.css" />
  </head>
  <body class="ung-dung-trang">
    <a class="bo-qua-lien-ket" href="#noi-dung">Bỏ qua điều hướng</a>
    <header class="web-dau">
      <div class="bao dau-trong">
        <a class="thuong-hieu" href="index.html"
          >Cine<span class="thuong-hieu-nhan">Snack</span></a
        >
        <nav class="chinh-dieu-huong" aria-label="Điều hướng">
          <a href="movies.html">Phim</a><a href="booking.html">Đặt vé</a
          ><a href="orders.html" aria-current="page">Đơn của tôi</a>
        </nav>
        <div class="account-actions"></div>
      </div>
    </header>
    <main id="noi-dung" class="bao ung-dung-chinh" tabindex="-1">
      <h1>Đơn hàng & hóa đơn</h1>
      <p>
        Thanh toán tại quầy trước thời hạn giữ chỗ. Hóa đơn xuất hiện sau khi
        nhân viên nhận đủ tiền.
      </p>
      <p id="don-loi" class="loi" role="alert" tabindex="-1"></p>
      <a
        id="orders-login"
        class="nut"
        href="authentication.html?next=orders.html"
        hidden
        >Đăng nhập để xem đơn</a
      >
      <div id="orders-content" class="orders-grid" hidden>
        <section class="khung">
          <h2>Đơn của tôi</h2>
          <button type="button" id="tai-danh-sach" class="chu-nut">
            Tải lại danh sách
          </button>
          <ul id="danh-sach-don" class="order-list"></ul>
          <div class="phan-trang">
            <button type="button" id="don-truoc" class="nut phu">
              Trang trước</button
            ><button type="button" id="don-sau" class="nut phu">
              Trang sau
            </button>
          </div>
        </section>
        <section class="khung">
          <h2>Chi tiết đơn</h2>
          <div id="chi-tiet-don"><p>Chọn một đơn để xem chi tiết.</p></div>
        </section>
      </div>
    </main>
  </body>
</html>
