# Cấu hình kết nối qua biến môi trường, không lưu mật khẩu trong source code.
spring.datasource.url=${CINESNACK_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=CineSnack;encrypt=true}
spring.datasource.username=${CINESNACK_DB_USER:}
spring.datasource.password=${CINESNACK_DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET ANSI_NULLS ON; SET ANSI_PADDING ON; SET ANSI_WARNINGS ON; SET ARITHABORT ON; SET CONCAT_NULL_YIELDS_NULL ON; SET QUOTED_IDENTIFIER ON; SET NUMERIC_ROUNDABORT OFF
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
