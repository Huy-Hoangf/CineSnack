# URL và tài khoản được cấu hình trong DatabaseConnection.java trên từng máy.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET ANSI_NULLS ON; SET ANSI_PADDING ON; SET ANSI_WARNINGS ON; SET ARITHABORT ON; SET CONCAT_NULL_YIELDS_NULL ON; SET QUOTED_IDENTIFIER ON; SET NUMERIC_ROUNDABORT OFF
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Đổi người nhận QR: sửa payment.qr.bank-id, payment.qr.bank-name,
# payment.qr.account-no và payment.qr.account-name
# trong ~/.cinesnack/qr.properties trên máy chạy ứng dụng, rồi khởi động lại.
# Có thể dùng các biến môi trường bên dưới nếu không có file cấu hình riêng.
payment.qr.bank-id=${CINESNACK_QR_BANK_ID:}
payment.qr.bank-name=${CINESNACK_QR_BANK_NAME:Techcombank}
payment.qr.account-no=${CINESNACK_QR_ACCOUNT_NO:}
payment.qr.account-name=${CINESNACK_QR_ACCOUNT_NAME:}
