spring.application.name=CineSnack
server.port=8080
spring.web.resources.static-locations=classpath:/UI/
spring.config.import=classpath:payment.properties,optional:file:${user.home}/.cinesnack/gmail.properties,optional:file:${user.home}/.cinesnack/qr.properties,optional:file:${user.home}/.cinesnack/guest.properties
# Database được khởi tạo/nâng cấp thủ công; khởi động không chạy SQL.
spring.sql.init.mode=never
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CineSnack;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
mail.gmail.client-id=${GMAIL_CLIENT_ID:}
mail.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
mail.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
mail.gmail.sender-email=${GMAIL_SENDER_EMAIL:}
security.guest-link-secret=${GUEST_ACCESS_SECRET:}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
